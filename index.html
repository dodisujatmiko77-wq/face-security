<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Foto Kelas</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:min(520px,100%);min-height:100vh;background:#0b1728;display:flex;flex-direction:column}
header{padding:18px 20px;border-bottom:1px solid #223047}h1{font-size:18px;margin:0 0 6px}.sub{font-size:12px;color:#9fb0c7}
main{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}
.preview{position:relative;border-radius:18px;overflow:hidden;background:#000;min-height:360px;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
.status{font-size:12px;color:#cbd5e1;background:#111e31;border-radius:12px;padding:11px}
button{border:0;border-radius:14px;padding:15px;font-weight:800;font-size:14px;cursor:pointer}
.capture{background:#10b981;color:#fff}.cancel{background:#263449;color:#dbeafe}.error{background:#3a1720;color:#fecaca;padding:12px;border-radius:12px;font-size:12px;display:none}
footer{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<div class="card">
<header><h1 id="title">Foto Kelas</h1><div class="sub">Bukti visual kegiatan mengajar</div></header>
<main>
<div class="preview"><video id="video" autoplay playsinline muted></video></div>
<div id="status" class="status">Menyiapkan kamera...</div>
<div id="error" class="error"></div>
</main>
<footer>
<button class="cancel" id="cancel">BATAL</button>
<button class="capture" id="capture">📸 AMBIL FOTO</button>
</footer>
</div>
<script>
let stream=null,parentOrigin='*',initialized=false;
const video=document.getElementById('video');
const statusEl=document.getElementById('status');
const errorEl=document.getElementById('error');
function send(type,data){
  try{ if(window.opener) window.opener.postMessage(Object.assign({source:'CLASS_CAMERA_V1',type:type},data||{}),parentOrigin||'*'); }catch(e){}
}
async function openCamera(){
  // IMPORTANT: INIT_CLASS_PHOTO can be sent more than once while the
  // parent waits for CAMERA_READY. Never recreate the stream or reload
  // video.srcObject when the camera is already active.
  if (stream && stream.getTracks().some(t => t.readyState === 'live') &&
      video.srcObject === stream) {
    statusEl.textContent='Kamera aktif. Pastikan guru dan kondisi kelas terlihat jelas.';
    return;
  }

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    throw new Error('Browser tidak mendukung kamera.');
  }

  stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},
    audio:false
  });

  video.srcObject=stream;

  // Wait for metadata before playing. This avoids the
  // "play() request was interrupted by a new load request" race.
  await new Promise((resolve, reject) => {
    let done=false;
    const finish=()=>{
      if(done) return;
      done=true;
      video.removeEventListener('loadedmetadata', finish);
      resolve();
    };
    video.addEventListener('loadedmetadata', finish, {once:true});
    setTimeout(finish, 2500);
  });

  try {
    await video.play();
  } catch (err) {
    // A second play attempt after the browser has attached the stream
    // is safer than allowing a transient interrupted play to surface.
    await new Promise(r => setTimeout(r, 150));
    await video.play();
  }

  statusEl.textContent='Kamera aktif. Pastikan guru dan kondisi kelas terlihat jelas.';
}
function stop(){
  if(stream){stream.getTracks().forEach(t=>{try{t.stop()}catch(e){}});stream=null}
  video.srcObject=null;
}
async function capture(){
  if(!video.videoWidth || !video.videoHeight){statusEl.textContent='Kamera belum siap.';return}
  const canvas=document.createElement('canvas');
  const scale=Math.min(1,1280/video.videoWidth);
  canvas.width=Math.max(1,Math.round(video.videoWidth*scale));
  canvas.height=Math.max(1,Math.round(video.videoHeight*scale));
  canvas.getContext('2d',{alpha:false}).drawImage(video,0,0,canvas.width,canvas.height);
  const photoData=canvas.toDataURL('image/jpeg',0.82);
  statusEl.textContent='Foto berhasil diambil. Mengirim...';
  document.getElementById('capture').disabled=true;
  send('PHOTO_RESULT',{photoData:photoData});
  setTimeout(stop,300);
}
window.addEventListener('message',async e=>{
  if(!window.opener || e.source!==window.opener) return;
  if(!e.data || e.data.source!=='ABSENSI_APP_V32') return;
  if(e.data.type!=='INIT_CLASS_PHOTO') return;

  parentOrigin=e.data.parentOrigin||e.origin||'*';
  document.getElementById('title').textContent=e.data.title||'Foto Kelas';

  // If the camera is already active, only acknowledge the parent.
  // Do NOT call openCamera() again.
  if(stream && stream.getTracks().some(t => t.readyState === 'live') &&
     video.srcObject === stream) {
    initialized=true;
    send('CAMERA_READY',{});
    return;
  }

  if(initialized) {
    send('CAMERA_READY',{});
    return;
  }

  initialized=true;

  try{
    await openCamera();
    send('CAMERA_READY',{});
  }catch(err){
    let msg='Kamera tidak dapat diakses.';
    if(err.name==='NotAllowedError') msg='Izin kamera ditolak browser. Izinkan kamera untuk situs ini.';
    else if(err.name==='NotFoundError') msg='Kamera tidak ditemukan.';
    else if(err.name==='NotReadableError') msg='Kamera sedang digunakan aplikasi lain.';
    else if(err.message) msg=err.message;
    errorEl.style.display='block';
    errorEl.textContent=msg;
    statusEl.textContent='Kamera gagal dibuka.';
    initialized=false;
    send('PHOTO_ERROR',{message:msg,reason:err.name||'CAMERA'});
  }
});
document.getElementById('capture').onclick=capture;
document.getElementById('cancel').onclick=()=>{send('CAMERA_CANCEL',{});stop();window.close()};
</script>
</body>
</html>
